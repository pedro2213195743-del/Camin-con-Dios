name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10camino_con_dios_android
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar logo.png
        run: |
          if [ -f ../logo.png ]; then
            pip install -q pillow
            python3 -c 'from PIL import Image,ImageDraw; src=Image.open("../logo.png").convert("RGBA"); s=min(src.size); src=src.crop(((src.width-s)//2,(src.height-s)//2,(src.width+s)//2,(src.height+s)//2)); [im.save(f"app/src/main/res/{f}/ic_launcher.png") or (lambda m,r: (ImageDraw.Draw(m).ellipse([0,0,sz-1,sz-1],fill=255), r.paste(im,(0,0),m), r.save(f"app/src/main/res/{f}/ic_launcher_round.png")))(Image.new("L",(sz,sz),0),Image.new("RGBA",(sz,sz),(0,0,0,0))) for f,sz in [("mipmap-mdpi",48),("mipmap-hdpi",72),("mipmap-xhdpi",96),("mipmap-xxhdpi",144),("mipmap-xxxhdpi",192)] for im in [src.resize((sz,sz),Image.LANCZOS)]]'
          fi
      - run: curl -fsSL https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/es_rvr1960.json -o app/src/main/assets/www/bible_es.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CaminoConDios-APK-Offline
          path: 10camino_con_dios_android/app/build/outputs/apk/release/*.apk
